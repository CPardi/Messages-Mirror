name: Prepare Release PR

on:
  workflow_dispatch:
    inputs:
      based_on:
        description: "Base branch or tag to base the release on"
        required: true
        type: string
      feature_branch:
        description: "Branch containing additional features"
        default: "feature/_main-message-mirror"
        type: string

jobs:
  prepare-release-branch:
    name: Prepare release branch from VERSION_NAME
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # ensure full history for rebase operations

      - name: Create GitHub app token
        id: app-token
        uses: actions/create-github-app-token@7e473efe3cb98aa54f8d4bac15400b15fad77d94
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Set up JDK
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Show repository files (debug)
        run: |
          echo "Listing repository root files for debug"
          ls -la

      - name: Create release branch
        id: release-branch
        run: |
          git remote add upstream https://github.com/FossifyOrg/Messages.git
          git fetch upstream --tags
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          mirrorVersion=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          version="$mirrorVersion+based_on=${{inputs.based_on}}"
          echo "VERSION_NAME=$version" >> $GITHUB_OUTPUT

          git checkout ${{inputs.feature_branch}}
          git checkout -b $version
          git rebase --onto ${{inputs.based_on}} origin/main $version
          git push origin $version

      - name: Build Release APK
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.jks
          ./gradlew assembleFossRelease -PVERSION_NAME="${{ steps.release-branch.outputs.VERSION_NAME }}"
        env:
          SIGNING_STORE_FILE: release.jks
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe
        with:
          tag_name: ${{ steps.release-branch.outputs.VERSION_NAME }}
          name: ${{ steps.release-branch.outputs.VERSION_NAME }}
          body: "TODO"
          draft: TRUE
          files: app/build/outputs/apk/foss/release/*release.apk
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
